name: build-exe

on:
  workflow_dispatch:
  push:
    branches: [main, dev]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --onefile --windowed --name ImageLab --add-data "images;images" main.py
      - uses: actions/upload-artifact@v4
        with:
          name: ImageLab-exe
          path: dist/ImageLab.exe
