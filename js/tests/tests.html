<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Color Lab — автотесты модели</title>
<style>
 body{font:15px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;margin:32px;color:#16181d;background:#f4f5f7}
 h1{font-size:19px}
 a{color:#2f6df6}
 #summary{display:inline-block;padding:8px 14px;border-radius:9px;font-weight:600;margin:12px 0}
 #summary.ok{background:#e6f7ec;color:#0a7a37}
 #summary.fail{background:#fdeaea;color:#b21f1f}
 table{border-collapse:collapse;background:#fff;border:1px solid #e3e5ea;border-radius:12px;overflow:hidden;width:100%}
 td{padding:8px 12px;border-bottom:1px solid #eef0f3;font-size:14px;vertical-align:top}
 tr.ok td:first-child{color:#0a7a37;font-weight:700}
 tr.fail td:first-child{color:#b21f1f;font-weight:700}
 tr.fail td{background:#fff7f7}
 td:nth-child(3){color:#6b7280;font-family:ui-monospace,Menlo,monospace;font-size:12.5px}
</style>
</head>
<body>
<h1>Тесты преобразований</h1>
<p><a href="../../index.html">← к приложению</a></p>
<div id="summary">выполняются…</div>
<table><tbody id="out"></tbody></table>
<script type="module" src="tests.js"></script>
</body>
</html>
